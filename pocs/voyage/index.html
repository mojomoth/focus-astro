<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070d" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Focus Astronaut · 항해 PoC</title>
  <link rel="icon" href="data:," />
  <script>
    // pocs/mockup 과 같은 규칙: 첫 페인트 전에 표시 모드 결정
    // ?frame=1 → 항상 목업, ?frame=0 → 항상 전체 화면, 그 외에는 입력 장치로 판별
    (function () {
      var p = new URLSearchParams(location.search).get('frame');
      var mobile = matchMedia('(hover: none) and (pointer: coarse)').matches;
      document.documentElement.dataset.mode = p === '1' ? 'mockup' : p === '0' ? 'full' : mobile ? 'full' : 'mockup';
    })();
  </script>
  <style>
    /* ═════════════ 목업 셸 (pocs/mockup/styles.css 에서 가져옴) ═════════════ */
    :root {
      /* 프레임 원본 851×1848 을 1/2 로 줄인 논리 좌표 */
      --frame-w: 425.5px;
      --frame-h: 924px;
      --screen-x: 18px;
      --screen-y: 17px;
      --screen-w: 390px;
      --screen-h: 891px;
      --screen-r: 55px;
      --s: 1; /* shell.js 가 뷰포트에 맞춰 계산 */
      --ink: #f4f6fb;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #05070d;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    img { -webkit-user-drag: none; user-select: none; -webkit-touch-callout: none; }

    .stage { position: fixed; inset: 0; }
    .device { position: relative; }
    .frame, .stage-caption { display: none; }

    /* --- 데스크톱: 아이폰 목업 --- */
    [data-mode="mockup"] .stage {
      background:
        radial-gradient(60% 50% at 50% 42%, rgba(70, 110, 190, .18), transparent 70%),
        radial-gradient(40% 40% at 80% 90%, rgba(150, 90, 200, .10), transparent 70%),
        #07090f;
    }
    [data-mode="mockup"] .device {
      position: absolute;
      left: 50%;
      top: calc(50% - 20px);
      width: var(--frame-w);
      height: var(--frame-h);
      margin: calc(var(--frame-h) / -2) 0 0 calc(var(--frame-w) / -2);
      transform: scale(var(--s));
      transform-origin: center center;
      filter: drop-shadow(0 40px 80px rgba(0, 0, 0, .55));
    }
    [data-mode="mockup"] .screen {
      position: absolute;
      left: var(--screen-x);
      top: var(--screen-y);
      width: var(--screen-w);
      height: var(--screen-h);
      border-radius: var(--screen-r);
      overflow: hidden;
      clip-path: inset(0 round var(--screen-r));
      /* 가상 안전 영역: iPhone 15 Pro 세로 */
      --sat: 54px; --sab: 34px; --sal: 0px; --sar: 0px;
    }
    [data-mode="mockup"] .frame {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    [data-mode="mockup"] .stage-caption {
      display: block;
      position: fixed;
      left: 0; right: 0; bottom: 18px;
      margin: 0;
      text-align: center;
      font-size: 12px;
      letter-spacing: .02em;
      color: rgba(255, 255, 255, .38);
    }
    [data-mode="mockup"] .stage-caption span { margin-left: 8px; color: rgba(255, 255, 255, .22); }

    /* --- 모바일: 전체 화면 --- */
    [data-mode="full"] .device,
    [data-mode="full"] .screen { position: fixed; inset: 0; width: 100%; height: 100%; }
    [data-mode="full"] .screen {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }
    [data-mode="full"] .sim-statusbar,
    [data-mode="full"] .sim-home { display: none; }

    .sim-statusbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: var(--sat);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 30px 0 46px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -.01em;
      z-index: 5;
      pointer-events: none;
    }
    .sb-icons { display: inline-flex; gap: 6px; align-items: center; }
    .sb-icons svg { fill: currentColor; color: var(--ink); }
    .sim-home {
      position: absolute;
      left: 50%;
      bottom: 8px;
      width: 134px; height: 5px;
      margin-left: -67px;
      border-radius: 3px;
      background: rgba(255, 255, 255, .85);
      z-index: 6;
      pointer-events: none;
    }

    /* ═════════════ 항해 화면 ═════════════ */
    .app {
      position: absolute;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
      background: #03050a;
      /* 화면(목업 스크린 또는 전체 화면) 기준으로 크기를 잡기 위한 컨테이너 */
      container-type: size;
      --fade-ms: 5000ms; /* 전환 5초 */
      --ship-scale: .25; /* 우주선 크기 배율 (이전 대비 1/4) */
      --ship-base: min(40cqw, 58cqh, 640px);
    }

    /* 배경: 두 레이어를 번갈아 페이드 */
    .bg {
      position: absolute;
      inset: -6%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity var(--fade-ms) cubic-bezier(.45, 0, .55, 1);
      will-change: opacity, transform;
    }
    .bg.is-on { opacity: 1; }
    /* 오른쪽→왼쪽으로 아주 느리게 흘러 항해감을 더함 (페이드인 5s + 유지 5s + 페이드아웃 5s 동안 계속) */
    .bg.drift { animation: drift 16s linear forwards; }
    @keyframes drift {
      from { transform: translate3d(3%, 0, 0) scale(1.04); }
      to   { transform: translate3d(-3%, 0, 0) scale(1.04); }
    }
    /* 밝은 성운에서도 우주선이 읽히도록 스크림 + 비네트 */
    .scrim {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 50% 50%, rgba(3,5,10,0) 0%, rgba(3,5,10,.35) 70%, rgba(3,5,10,.8) 100%),
        rgba(3,5,10,.28);
      pointer-events: none;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* 우주선: 화면 정중앙 */
    .ship {
      position: absolute;
      left: 50%;
      top: 50%;
      width: calc(var(--ship-base) * var(--ship-scale));
      height: auto;
      transform: translate(-50%, -50%);
      will-change: transform;
      user-select: none;
      filter: drop-shadow(0 0 10px rgba(120, 200, 255, .1));
    }

    .credit {
      position: absolute;
      left: max(16px, calc(var(--sal) + 12px));
      right: max(16px, calc(var(--sar) + 12px));
      bottom: calc(var(--sab) + 8px);
      margin: 0;
      font-size: 9px;
      line-height: 1.4;
      color: rgba(232, 236, 243, .45);
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: opacity 600ms ease;
      pointer-events: none;
    }

    /* 휴식: 배경 흐름도 멈춘다 (전환 타이머는 voyage.js 의 항해 시계가 멈춤) */
    .app[data-state="rest"] .bg.drift { animation-play-state: paused; }

    /* 하단 집중/휴식 토글 */
    .mode-toggle {
      position: absolute;
      left: 50%;
      bottom: calc(var(--sab) + 34px);
      transform: translateX(-50%);
      z-index: 7;
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 200px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(16, 20, 32, .55);
      border: 1px solid rgba(255, 255, 255, .12);
      -webkit-backdrop-filter: blur(14px) saturate(1.3);
      backdrop-filter: blur(14px) saturate(1.3);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
    }
    .mode-toggle::before {
      /* 선택 표시(thumb): 집중=왼쪽·앰버, 휴식=오른쪽·블루 */
      content: "";
      position: absolute;
      top: 4px; bottom: 4px; left: 4px;
      width: calc(50% - 4px);
      border-radius: 999px;
      background: linear-gradient(180deg, #ffd88a, #ffb547);
      box-shadow: 0 0 18px rgba(255, 190, 90, .35);
      transition: transform 380ms cubic-bezier(.34, 1.3, .5, 1), background 380ms ease, box-shadow 380ms ease;
    }
    .app[data-state="rest"] .mode-toggle::before {
      transform: translateX(100%);
      background: linear-gradient(180deg, #b6e4ff, #7cc6ff);
      box-shadow: 0 0 18px rgba(120, 200, 255, .35);
    }
    .seg {
      position: relative;
      z-index: 1;
      height: 44px;
      border: 0;
      border-radius: 999px;
      background: none;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -.01em;
      color: rgba(232, 238, 250, .7);
      cursor: pointer;
      transition: color 300ms ease;
      -webkit-tap-highlight-color: transparent;
    }
    .seg[aria-pressed="true"] { color: #141821; }
    .seg:focus-visible { outline: 2px solid rgba(255, 255, 255, .6); outline-offset: 2px; }

    /* 세로 화면: 우주선 기준폭을 넓히고 배경을 더 눌러 준다 */
    @container (orientation: portrait) {
      .ship { --ship-base: min(62cqw, 440px); }
      .bg { filter: brightness(.75) saturate(.9); }
      .scrim {
        background:
          radial-gradient(ellipse 80% 55% at 50% 50%, rgba(3,5,10,0) 0%, rgba(3,5,10,.4) 70%, rgba(3,5,10,.85) 100%),
          rgba(3,5,10,.42);
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="device" id="device">
      <!-- 목업의 투명한 스크린 영역(851×1848 원본 기준 x36 y34 780×1782)에 맞춘다 -->
      <div class="screen" id="screen">
        <div class="app" id="app" aria-label="우주선 항해">
          <div class="bg" id="bgA"></div>
          <div class="bg" id="bgB"></div>
          <div class="scrim"></div>
          <canvas id="smoke"></canvas>
          <img class="ship" id="ship" src="assets/ship.png" alt="항해 중인 우주선" draggable="false" />
          <canvas id="dust"></canvas>
          <p class="credit" id="credit"></p>

          <!-- 집중이면 항해(우주선 이동), 휴식이면 엔진 정지 -->
          <div class="mode-toggle" role="group" aria-label="집중 / 휴식 전환">
            <button class="seg" type="button" data-mode="focus" aria-pressed="true">집중</button>
            <button class="seg" type="button" data-mode="rest" aria-pressed="false">휴식</button>
          </div>

          <!-- 목업 모드 전용 가상 상태 표시줄 / 홈 인디케이터 -->
          <div class="sim-statusbar" aria-hidden="true">
            <span id="sbTime">9:41</span>
            <span class="sb-icons">
              <svg viewBox="0 0 18 12" width="18" height="12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
              <svg viewBox="0 0 16 12" width="16" height="12"><circle cx="8" cy="10.3" r="1.5"/><path d="M4.9 7.3a4.4 4.4 0 0 1 6.2 0M2.1 4.5a8.3 8.3 0 0 1 11.8 0" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
              <svg viewBox="0 0 27 12" width="27" height="12"><rect x=".5" y=".5" width="23" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="24.6" y="4" width="1.6" height="4" rx=".8" opacity=".4"/></svg>
            </span>
          </div>
          <div class="sim-home" aria-hidden="true"></div>
        </div>
      </div>
      <!-- 프레임 이미지는 화면 위에 덮고 포인터를 통과시킨다 -->
      <img class="frame" src="assets/mockup-iphone.png" alt="" aria-hidden="true" draggable="false" />
    </div>
    <p class="stage-caption">Focus Astronaut · 항해 PoC <span>모바일에서 열면 전체 화면으로 표시됩니다</span></p>
  </main>
  <script src="shell.js"></script>
  <script src="voyage.js"></script>
</body>
</html>
